<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image to Vector</title>
<script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>
<style>
:root{--bg:#f3f1ee;--panel:#fff;--ink:#1d1b19;--muted:#6b665f;--line:#d9d4cc;--accent:#1f4fd8;--accent-ink:#fff;--check1:#e9e6e1;--check2:#f7f5f2}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--panel:#201f1c;--ink:#efece7;--muted:#9a948a;--line:#38352f;--accent:#7a9bff;--accent-ink:#0c1020;--check1:#2a2824;--check2:#232120}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh}
main{max-width:1100px;margin:0 auto;padding:28px 20px 48px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.layout{display:grid;grid-template-columns:280px 1fr;gap:18px}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
#drop{border:2px dashed var(--line);border-radius:10px;padding:22px 12px;text-align:center;cursor:pointer;color:var(--muted);margin-bottom:16px}
#drop.over,#drop:focus-visible{border-color:var(--accent);color:var(--ink);outline:none}
#drop strong{color:var(--ink);display:block}
label{display:block;margin:12px 0 2px;font-weight:600;font-size:13px}
label span{float:right;font-weight:400;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
select{width:100%;padding:7px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.views{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.views{grid-template-columns:1fr}}
.view h2{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:600}
.stage{aspect-ratio:1/1;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;
background-image:linear-gradient(45deg,var(--check1) 25%,transparent 25%,transparent 75%,var(--check1) 75%),linear-gradient(45deg,var(--check1) 25%,transparent 25%,transparent 75%,var(--check1) 75%);
background-size:16px 16px;background-position:0 0,8px 8px;background-color:var(--check2)}
.stage img,.stage svg{max-width:100%;max-height:100%;display:block}
.stage.empty::after{content:"Nothing yet";color:var(--muted)}
#status{margin-top:12px;color:var(--muted);font-size:13px;min-height:20px}
</style>
</head>
<body>
<main>
<h1>Image to Vector</h1>
<p class="sub">Drop in a logo or photo and get an SVG back. Everything runs in your browser; nothing is uploaded.</p>
<div class="layout">
  <section class="panel">
    <div id="drop" tabindex="0" role="button" aria-label="Choose an image">
      <strong>Drop an image here</strong>or click to browse (PNG, JPG, WebP)
    </div>
    <input id="file" type="file" accept="image/*" hidden>

    <label for="preset">Style</label>
    <select id="preset">
      <option value="logo">Logo / flat graphic</option>
      <option value="bw">Black and white</option>
      <option value="photo">Photo (posterized)</option>
    </select>

    <label for="colors">Colors <span id="colorsV"></span></label>
    <input id="colors" type="range" min="2" max="48" value="8">

    <label for="detail">Detail <span id="detailV"></span></label>
    <input id="detail" type="range" min="1" max="10" value="6">

    <label for="smooth">Smoothing <span id="smoothV"></span></label>
    <input id="smooth" type="range" min="0" max="5" value="1">

    <label for="speck">Remove specks <span id="speckV"></span></label>
    <input id="speck" type="range" min="0" max="60" value="8">

    <label for="size">Working size <span id="sizeV"></span></label>
    <input id="size" type="range" min="200" max="1600" step="100" value="800">

    <div class="row">
      <button id="go" class="primary" disabled>Convert</button>
      <button id="dl" disabled>Download SVG</button>
      <button id="copy" disabled>Copy code</button>
    </div>
    <div id="status" role="status"></div>
  </section>

  <section class="panel">
    <div class="views">
      <div class="view"><h2>Original</h2><div class="stage empty" id="origStage"></div></div>
      <div class="view"><h2>Vector result</h2><div class="stage empty" id="svgStage"></div></div>
    </div>
  </section>
</div>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var img=null, svgText='', fileName='vector', timer=null;

  var presets={
    logo:{colors:8,detail:6,smooth:1,speck:8},
    bw:{colors:2,detail:7,smooth:1,speck:6},
    photo:{colors:24,detail:4,smooth:2,speck:20}
  };
  function labels(){
    $('colorsV').textContent=$('colors').value;
    $('detailV').textContent=$('detail').value;
    $('smoothV').textContent=$('smooth').value;
    $('speckV').textContent=$('speck').value;
    $('sizeV').textContent=$('size').value+'px';
  }
  function applyPreset(){
    var p=presets[$('preset').value];
    $('colors').value=p.colors;$('detail').value=p.detail;$('smooth').value=p.smooth;$('speck').value=p.speck;
    labels();
  }
  function setStatus(t){$('status').textContent=t}

  function loadFile(f){
    if(!f||!f.type.match(/^image\//)){setStatus('That file is not an image. Choose a PNG, JPG or WebP.');return}
    fileName=f.name.replace(/\.[^.]+$/,'')||'vector';
    var url=URL.createObjectURL(f), im=new Image();
    im.onload=function(){
      img=im;
      var o=$('origStage');o.classList.remove('empty');o.innerHTML='';
      var c=new Image();c.src=url;c.alt='Original image';o.appendChild(c);
      $('go').disabled=false;
      setStatus('Loaded '+im.naturalWidth+' x '+im.naturalHeight+'. Converting...');
      convert();
    };
    im.onerror=function(){setStatus('Could not read that image.')};
    im.src=url;
  }

  function convert(){
    if(!img)return;
    if(typeof ImageTracer==='undefined'){setStatus('The tracing library did not load. Check your internet connection and reload.');return}
    setStatus('Converting...');
    $('go').disabled=true;
    setTimeout(function(){
      try{
        var max=+$('size').value, s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
        var w=Math.max(1,Math.round(img.naturalWidth*s)), h=Math.max(1,Math.round(img.naturalHeight*s));
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;
        var ctx=cv.getContext('2d');ctx.drawImage(img,0,0,w,h);
        var data=ctx.getImageData(0,0,w,h);
        var d=+$('detail').value;
        var opts={
          numberofcolors:+$('colors').value,
          colorsampling:2,
          colorquantcycles:3,
          ltres:Math.max(0.1,(11-d)*0.25),
          qtres:Math.max(0.1,(11-d)*0.25),
          pathomit:+$('speck').value,
          blurradius:+$('smooth').value,
          blurdelta:20,
          strokewidth:0,
          roundcoords:1,
          viewbox:true,
          desc:false
        };
        svgText=ImageTracer.imagedataToSVG(data,opts);
        var st=$('svgStage');st.classList.remove('empty');st.innerHTML=svgText;
        ['dl','copy'].forEach(function(i){$(i).disabled=false});
        setStatus('Done. '+Math.round(svgText.length/1024)+' KB SVG.');
      }catch(e){setStatus('Conversion failed: '+e.message)}
      $('go').disabled=false;
    },30);
  }
  function queue(){labels();if(img){clearTimeout(timer);timer=setTimeout(convert,350)}}

  var drop=$('drop');
  drop.addEventListener('click',function(){$('file').click()});
  drop.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}});
  $('file').addEventListener('change',function(e){loadFile(e.target.files[0])});
  ['dragenter','dragover'].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.add('over')})});
  ['dragleave','drop'].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.remove('over')})});
  drop.addEventListener('drop',function(e){loadFile(e.dataTransfer.files[0])});
  window.addEventListener('paste',function(e){
    var it=[].slice.call(e.clipboardData.items).filter(function(i){return i.type.indexOf('image/')===0})[0];
    if(it)loadFile(it.getAsFile());
  });

  $('preset').addEventListener('change',function(){applyPreset();queue()});
  ['colors','detail','smooth','speck','size'].forEach(function(id){$(id).addEventListener('input',queue)});
  $('go').addEventListener('click',convert);
  $('dl').addEventListener('click',function(){
    var b=new Blob([svgText],{type:'image/svg+xml'}), a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=fileName+'.svg';document.body.appendChild(a);a.click();a.remove();
  });
  $('copy').addEventListener('click',function(){
    navigator.clipboard.writeText(svgText).then(function(){setStatus('SVG code copied.')},function(){setStatus('Copy blocked by the browser. Use Download instead.')});
  });
  applyPreset();
})();
</script>
</body>
</html>
